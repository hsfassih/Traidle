<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traidle — Live Chart</title>
<!--
  Pinned to an exact version, not a floating "latest" pointer: Lightweight
  Charts v5 changed series creation to addSeries(SeriesType, options), which
  would silently break every call below if the CDN ever served v5 here.
  Bump this deliberately if you want to move to v5.
-->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e1117; color: #d1d4dc;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #topbar { display: flex; align-items: center; gap: 16px; padding: 8px 12px;
            background: #161a25; border-bottom: 1px solid #2a2e39; flex-shrink: 0; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  #statusDot { width: 9px; height: 9px; border-radius: 50%; background: #888; display: inline-block; }
  #statusDot.connecting { background: #ffca28; }
  #statusDot.connected { background: #26a69a; }
  #statusDot.disconnected { background: #ef5350; }
  #portInput { width: 60px; background: #0e1117; color: #d1d4dc; border: 1px solid #2a2e39;
               padding: 2px 4px; border-radius: 3px; }
  #reconnectBtn { background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39;
                  padding: 4px 10px; border-radius: 3px; cursor: pointer; }
  #tabs { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
  .tab { background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39; padding: 4px 10px;
         cursor: pointer; border-radius: 3px; font-size: 12px; }
  .tab.active { background: #2962ff; border-color: #2962ff; color: white; }

  #toolbar2 { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
              background: #12151d; border-bottom: 1px solid #2a2e39; flex-shrink: 0; flex-wrap: wrap; }
  .toolbar-label { color: #868c98; font-size: 12px; margin-right: 2px; }
  .toggle-btn { background: #1e222d; color: #868c98; border: 1px solid #2a2e39;
                padding: 3px 10px; border-radius: 12px; cursor: pointer; font-size: 11px; }
  .toggle-btn.active { background: rgba(38,166,154,0.18); border-color: #26a69a; color: #26a69a; }
  .toolbar-select { background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39;
                    padding: 3px 6px; border-radius: 3px; font-size: 11px; }
  .toolbar-divider { width: 1px; height: 16px; background: #2a2e39; margin: 0 4px; }
  #biasBadge { font-size: 11px; padding: 3px 10px; border-radius: 12px; border: 1px solid #2a2e39;
               color: #868c98; background: #1e222d; }
  #biasBadge.bullish { color: #26a69a; border-color: #26a69a; background: rgba(38,166,154,0.12); }
  #biasBadge.bearish { color: #ef5350; border-color: #ef5350; background: rgba(239,83,80,0.12); }

  #main { display: flex; flex: 1; min-height: 0; }
  #chartContainer { flex: 1; position: relative; }
  #volumeProfileOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .vp-bar { position: absolute; left: 0; }
  .vp-buy { background: rgba(38,166,154,0.45); }
  .vp-sell { background: rgba(239,83,80,0.45); }

  /* SMC/ICT zone overlay (FVGs, Order Blocks, Premium/Discount+OTE band) -
     same absolutely-positioned-div technique as the volume profile above,
     just price/time bounded instead of a left-edge histogram. Sits below
     the volume profile (z-index 1 vs 2) so vp bars stay legible on top. */
  #smcZonesOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .smc-zone { position: absolute; box-sizing: border-box; }
  .smc-zone-label { position: absolute; font-size: 10px; padding: 1px 4px; border-radius: 2px;
                     white-space: nowrap; pointer-events: none; }
  .smc-fvg-bullish { background: rgba(38,166,154,0.16); border-top: 1px dashed rgba(38,166,154,0.5);
                      border-bottom: 1px dashed rgba(38,166,154,0.5); }
  .smc-fvg-bearish { background: rgba(239,83,80,0.16); border-top: 1px dashed rgba(239,83,80,0.5);
                      border-bottom: 1px dashed rgba(239,83,80,0.5); }
  .smc-ob-bullish { background: rgba(41,98,255,0.12); border: 1px solid rgba(41,98,255,0.45); }
  .smc-ob-bearish { background: rgba(255,167,38,0.12); border: 1px solid rgba(255,167,38,0.45); }
  .smc-ob-rejection { opacity: 0.55; border-style: dotted; }
  .smc-ob-breaker { border-style: dashed; }
  .smc-ote-band { background: rgba(255,255,255,0.05); border-top: 1px dashed rgba(255,255,255,0.25);
                  border-bottom: 1px dashed rgba(255,255,255,0.25); }

  /* Kill Zone shading - vertical time bands, full chart height. Computed
     entirely client-side from wall-clock time (see computeKillZoneBands())
     rather than sent from the backend - the browser's own Intl timezone
     support handles America/New_York (DST included) natively, which is
     simpler and more robust here than porting the backend's hand-rolled NY
     time math into JS as well. */
  #killZoneOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .kill-zone-band { position: absolute; top: 0; bottom: 0; }
  .kill-zone-label { background: rgba(14,17,23,0.55); top: 2px; }
  .kz-asian { background: rgba(156,39,176,0.12); border-left: 1px solid rgba(156,39,176,0.5); border-right: 1px solid rgba(156,39,176,0.5); }
  .kz-london { background: rgba(255,235,59,0.10); border-left: 1px solid rgba(255,235,59,0.45); border-right: 1px solid rgba(255,235,59,0.45); }
  .kz-new_york_am { background: rgba(38,166,154,0.12); border-left: 1px solid rgba(38,166,154,0.5); border-right: 1px solid rgba(38,166,154,0.5); }
  .kz-london_close { background: rgba(41,98,255,0.10); border-left: 1px solid rgba(41,98,255,0.45); border-right: 1px solid rgba(41,98,255,0.45); }

  #readout { width: 260px; padding: 12px; border-left: 1px solid #2a2e39; overflow-y: auto; }
  #readoutSymbol { margin: 0 0 8px 0; font-size: 15px; }
  .liveBadge { color: #ef5350; font-size: 11px; font-weight: bold; margin-left: 6px; }
  #readoutTable { width: 100%; border-collapse: collapse; font-size: 12px; }
  #readoutTable td { padding: 4px 2px; border-bottom: 1px solid #1e222d; }
  #readoutTable td:first-child { color: #868c98; }
  #readoutTable td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #predictionBox { margin-top: 12px; font-size: 12px; color: #868c98; }

  #selectedCandleBox { margin-top: 16px; padding-top: 12px; border-top: 1px solid #2a2e39; }
  #selectedCandleBox h4 { margin: 0 0 8px 0; font-size: 12px; color: #868c98; font-weight: 600;
                          text-transform: uppercase; letter-spacing: 0.03em; }
  #selectedCandleContent table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #selectedCandleContent td { padding: 4px 2px; border-bottom: 1px solid #1e222d; }
  #selectedCandleContent td:first-child { color: #868c98; }
  #selectedCandleContent td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #selectedCandleContent .placeholder { color: #5c6270; font-style: italic; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="status"><span id="statusDot" class="connecting"></span><span id="statusText">connecting...</span></div>
    <label>Port: <input id="portInput" value="8765" size="6" /></label>
    <button id="reconnectBtn">Reconnect</button>
    <div id="tabs"></div>
  </div>
  <div id="toolbar2">
    <span class="toolbar-label">Show:</span>
    <button class="toggle-btn active" data-target="sma">SMA</button>
    <button class="toggle-btn active" data-target="ema">EMA</button>
    <button class="toggle-btn active" data-target="bb">Bollinger</button>
    <button class="toggle-btn active" data-target="volume">Volume</button>
    <button class="toggle-btn active" data-target="volumeProfile">Vol Profile</button>
    <span class="toolbar-divider"></span>
    <span class="toolbar-label">SMC/ICT:</span>
    <button class="toggle-btn active" data-smc-target="swings">Swings</button>
    <button class="toggle-btn active" data-smc-target="fvg">FVG</button>
    <button class="toggle-btn active" data-smc-target="orderBlocks">Order Blocks</button>
    <button class="toggle-btn active" data-smc-target="structure">BOS/CHoCH</button>
    <button class="toggle-btn active" data-smc-target="liquidity">Liquidity</button>
    <button class="toggle-btn active" data-smc-target="pdhpdl">PDH/PDL</button>
    <button class="toggle-btn active" data-smc-target="premiumDiscount">Premium/OTE</button>
    <button class="toggle-btn active" data-smc-target="killZones">Kill Zones</button>
    <span class="toolbar-label">SMC/ICT:</span>
    <select id="smcTimeframeSelect" class="toolbar-select"></select>
    <span class="toolbar-divider"></span>
    <span id="biasBadge">bias: —</span>
  </div>
  <div id="main">
    <div id="chartContainer"></div>
    <div id="readout">
      <h3 id="readoutSymbol">—</h3>
      <table id="readoutTable"></table>
      <div id="predictionBox"></div>
      <div id="selectedCandleBox">
        <h4>Selected Candle</h4>
        <div id="selectedCandleContent"><span class="placeholder">Click a candlestick to inspect it.</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- constants ----
  const kMaxReconnectDelayMs = 3000;
  const kWatchdogSilenceMs = 20000;    // no message at all (not even a heartbeat) for this long -> force reconnect
  const kWatchdogCheckIntervalMs = 5000;
  const kVolumeProfileBuckets = 24;
  const kVolumeProfileMaxWidthPx = 90;
  const kMaxCandlesPerTimeframe = 50000; // mirrors the backend's ring-buffer cap (see visualization.cpp)

  // ---- state ----
  const state = {
    ws: null,
    reconnectTimer: null,
    reconnectDelayMs: 500,
    lastMessageAt: Date.now(),
    activeTimeframe: null,
    dataByTimeframe: new Map(),   // timeframe -> Map(openTimeSeconds -> message)
    knownTimeframes: [],         // first-seen order, drives the tab bar
    smcTimeframe: null,          // decoupled from activeTimeframe - only the SMC/ICT dropdown changes this
  };

  const toggleState = { sma: true, ema: true, bb: true, volume: true, volumeProfile: true };

  // Last known non-null value per indicator field, per timeframe. Forming
  // (not-yet-closed) candles broadcast an all-null indicator snapshot -
  // without this, the readout panel would blank RSI/MACD/etc. on nearly
  // every tick and only flash the real values for the instant a candle
  // closes. Populated from every message (live or history), independent
  // of which tab is currently active, so switching tabs shows correct
  // values immediately rather than waiting for a fresh tick.
  const lastIndicatorsByTf = new Map();

  function mergeIndicators(tf, incoming) {
    if (!incoming) return;
    const merged = lastIndicatorsByTf.get(tf) || {};
    for (const key of Object.keys(incoming)) {
      const value = incoming[key];
      if (value !== null && value !== undefined) {
        merged[key] = value;
      } else if (!(key in merged)) {
        merged[key] = null; // still warming up, never seen a value yet
      }
    }
    lastIndicatorsByTf.set(tf, merged);
  }

  function trimHistoryMap(map) {
    while (map.size > kMaxCandlesPerTimeframe) {
      const oldestKey = map.keys().next().value;
      map.delete(oldestKey);
    }
  }

  // ---- DOM ----
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const portInput = document.getElementById('portInput');
  const reconnectBtn = document.getElementById('reconnectBtn');
  const tabsEl = document.getElementById('tabs');
  const chartContainer = document.getElementById('chartContainer');
  const readoutSymbol = document.getElementById('readoutSymbol');
  const readoutTable = document.getElementById('readoutTable');
  const predictionBox = document.getElementById('predictionBox');
  const selectedCandleContent = document.getElementById('selectedCandleContent');
  const biasBadge = document.getElementById('biasBadge');
  const smcTimeframeSelect = document.getElementById('smcTimeframeSelect');

  // ---- chart setup (one instance, reused across timeframe tab switches) ----
  const chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { color: '#0e1117' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    timeScale: { timeVisible: true, secondsVisible: true, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });

  const volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: '', // overlay, not a separate pane
  });
  volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

  // SMA/EMA/Bollinger share the price scale, so they overlay directly.
  // RSI/MACD/Stoch/ATR/VWAP/OBV don't (different ranges/units) - they go
  // to the numeric readout panel instead of extra chart panes; see
  // updateReadout() below.
  const smaSeries = chart.addLineSeries({ color: '#42a5f5', lineWidth: 1, priceLineVisible: false, title: 'SMA20' });
  const emaSeries = chart.addLineSeries({ color: '#ffa726', lineWidth: 1, priceLineVisible: false, title: 'EMA20' });
  const bbUpperSeries = chart.addLineSeries({ color: 'rgba(255,255,255,0.35)', lineWidth: 1, priceLineVisible: false, title: 'BB Upper' });
  const bbLowerSeries = chart.addLineSeries({ color: 'rgba(255,255,255,0.35)', lineWidth: 1, priceLineVisible: false, title: 'BB Lower' });

  const seriesByToggleKey = {
    sma: [smaSeries],
    ema: [emaSeries],
    bb: [bbUpperSeries, bbLowerSeries],
    volume: [volumeSeries],
  };

  let activePriceLines = [];

  // Volume-profile overlay: a plain absolutely-positioned div, appended
  // AFTER createChart() has already run its own DOM setup on
  // chartContainer, so there's no risk of the library clobbering a
  // pre-existing child during its own initialization.
  const volumeProfileEl = document.createElement('div');
  volumeProfileEl.id = 'volumeProfileOverlay';

  // SMC/ICT overlays - same technique, two more layers (see the CSS
  // z-index comments): kill-zone time shading underneath, price/time zones
  // (FVG/OB/Premium-OTE) above that, volume profile on top of both.
  const killZoneEl = document.createElement('div');
  killZoneEl.id = 'killZoneOverlay';
  const smcZonesEl = document.createElement('div');
  smcZonesEl.id = 'smcZonesOverlay';
  chartContainer.appendChild(killZoneEl);
  chartContainer.appendChild(smcZonesEl);
  chartContainer.appendChild(volumeProfileEl);

  // ---- SMC/ICT state ----
  // One entry per timeframe, keyed the same way state.dataByTimeframe is.
  // Snapshots REPLACE an entry wholesale; updates merge into it - see
  // ingestSmcSnapshot()/ingestSmcUpdate() below. Deliberately NOT part of
  // `state` above - it has its own lifecycle (bulk replace vs. incremental
  // merge) that doesn't match how candle/indicator data flows.
  const smcState = { byTimeframe: new Map() };

  // Kill Zones defaults on like every other SMC/ICT toggle - see the
  // visibility fixes in the CSS/renderKillZoneBands() for why a faint,
  // hidden-by-default band was the actual bug, not the concept itself.
  const smcToggleState = {
    swings: true, fvg: true, orderBlocks: true, structure: true,
    liquidity: true, pdhpdl: true, premiumDiscount: true, killZones: true,
  };

  let activeSmcPriceLines = [];  // createPriceLine() handles - see renderLiquidityAndLevels()

  function resizeChart() {
    chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    recomputeVolumeProfile();
    renderSmcOverlays();
  }
  window.addEventListener('resize', resizeChart);
  resizeChart();

  chart.timeScale().subscribeVisibleLogicalRangeChange(() => { recomputeVolumeProfile(); renderSmcOverlays(); });

  // ---- click-to-inspect: show a clicked candle's OHLC in the side panel ----
  chart.subscribeClick((param) => {
    if (!param.time || state.activeTimeframe === null) return;
    const tfMap = state.dataByTimeframe.get(state.activeTimeframe);
    const row = tfMap ? tfMap.get(param.time) : null;
    if (!row) return; // clicked empty space / off a bar - leave the last selection as-is
    showSelectedCandle(row);
  });

  function showSelectedCandle(row) {
    const dt = new Date(row.open_time);
    const liveTag = row.closed === false ? ' <span class="liveBadge">● LIVE</span>' : '';
    const rows = [
      ['Time', dt.toLocaleString() + liveTag],
      ['Open', fmt(row.open, 4)],
      ['High', fmt(row.high, 4)],
      ['Low', fmt(row.low, 4)],
      ['Close', fmt(row.close, 4)],
      ['Base Vol', fmt(row.base_volume, 2)],
      ['Taker Buy Vol', fmt(row.taker_buy_base_volume, 2)],
    ];
    selectedCandleContent.innerHTML =
      '<table>' + rows.map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`).join('') + '</table>';
  }

  // ---- indicator/overlay toggles ----
  document.querySelectorAll('.toggle-btn[data-target]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.target;
      toggleState[key] = !toggleState[key];
      btn.classList.toggle('active', toggleState[key]);
      if (key === 'volumeProfile') {
        recomputeVolumeProfile();
      } else {
        (seriesByToggleKey[key] || []).forEach((s) => s.applyOptions({ visible: toggleState[key] }));
      }
    });
  });

  // ---- SMC/ICT toggles ----
  document.querySelectorAll('.toggle-btn[data-smc-target]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.smcTarget;
      smcToggleState[key] = !smcToggleState[key];
      btn.classList.toggle('active', smcToggleState[key]);
      renderSmcOverlays();
    });
  });

  // ---- SMC/ICT timeframe dropdown - fully decoupled from the chart's own
  // tabs (state.activeTimeframe): only this listener ever changes
  // state.smcTimeframe. ----
  smcTimeframeSelect.addEventListener('change', () => {
    state.smcTimeframe = smcTimeframeSelect.value;
    updateBiasBadge(state.smcTimeframe);
    renderSmcOverlays();
  });

  // ---- websocket ----
  function connect() {
    const port = portInput.value.trim() || '8765';
    setStatus('connecting', `connecting to ws://localhost:${port} ...`);
    const ws = new WebSocket(`ws://localhost:${port}`);
    state.ws = ws;

    ws.onopen = () => {
      state.reconnectDelayMs = 500; // reset backoff after a successful connect
      state.lastMessageAt = Date.now();
      setStatus('connected', `connected on port ${port}`);
    };
    ws.onclose = () => {
      setStatus('disconnected', 'disconnected — reconnecting...');
      scheduleReconnect();
    };
    ws.onerror = () => { /* onclose fires right after in every browser tested; let that path retry */ };
    ws.onmessage = (event) => {
      state.lastMessageAt = Date.now();
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; } // ignore malformed frames
      if (msg.type === 'candle') {
        ingestMessage(msg);
      } else if (msg.type === 'history') {
        ingestHistoryBatch(msg);
      } else if (msg.type === 'smc_snapshot') {
        ingestSmcSnapshot(msg);
      } else if (msg.type === 'smc_update') {
        ingestSmcUpdate(msg);
      }
      // heartbeat messages need no further handling beyond the lastMessageAt update above
    };
  }

  function scheduleReconnect() {
    if (state.reconnectTimer) return;
    state.reconnectTimer = setTimeout(() => { state.reconnectTimer = null; connect(); }, state.reconnectDelayMs);
    state.reconnectDelayMs = Math.min(state.reconnectDelayMs * 2, kMaxReconnectDelayMs);
  }

  // Client-side watchdog, mirroring the same silent-connection pattern the
  // C++ backend already uses for its own Binance WebSocket streams: if
  // nothing at all (not even a heartbeat) arrives for kWatchdogSilenceMs,
  // treat the link as dead and force a reconnect rather than waiting on
  // the browser's own close-detection.
  setInterval(() => {
    if (state.ws && state.ws.readyState === WebSocket.OPEN &&
        Date.now() - state.lastMessageAt > kWatchdogSilenceMs) {
      state.ws.close();
    }
  }, kWatchdogCheckIntervalMs);

  function setStatus(kind, text) {
    statusDot.className = kind;
    statusText.textContent = text;
  }

  reconnectBtn.addEventListener('click', () => {
    if (state.ws) state.ws.close();
    connect();
  });

  // ---- message ingestion (single live/forming/closed candle) ----
  function ingestMessage(msg) {
    const tf = msg.timeframe;
    const isNewTimeframe = !state.dataByTimeframe.has(tf);
    if (isNewTimeframe) {
      state.dataByTimeframe.set(tf, new Map());
      state.knownTimeframes.push(tf);
    }

    const timeSec = Math.floor(msg.open_time / 1000);
    const tfMap = state.dataByTimeframe.get(tf);
    tfMap.set(timeSec, msg); // overwrites in place as a forming candle ticks
    trimHistoryMap(tfMap);
    mergeIndicators(tf, msg.indicators);

    if (state.activeTimeframe === null) {
      if (state.smcTimeframe === null) state.smcTimeframe = tf; // first data ever - SMC dropdown starts matching the chart
      switchTimeframe(tf); // first message ever received - adopt its timeframe as the default view
      return;
    }

    if (isNewTimeframe) {
      renderTabs(); // just adds this timeframe's tab button; doesn't touch the chart
    }

    if (tf === state.activeTimeframe) {
      applyLiveUpdate(msg, timeSec);
    }
  }

  // ---- message ingestion (bulk history snapshot for one timeframe) ----
  // Sent once per timeframe right after connecting (see visualization.cpp's
  // sendHistorySnapshot / toHistoryJson) - up to 50,000 candles in one
  // message, applied via the same bulk switchTimeframe()->setData() path
  // used for tab switches, rather than 50,000 individual update() calls.
  function ingestHistoryBatch(msg) {
    const tf = msg.timeframe;
    if (!msg.candles || msg.candles.length === 0) return;

    const isNewTimeframe = !state.dataByTimeframe.has(tf);
    if (isNewTimeframe) {
      state.dataByTimeframe.set(tf, new Map());
      state.knownTimeframes.push(tf);
    }

    const tfMap = state.dataByTimeframe.get(tf);
    let lastRow = null;
    for (const candle of msg.candles) {
      const row = { ...candle, symbol: msg.symbol, timeframe: tf };
      const timeSec = Math.floor(row.open_time / 1000);
      tfMap.set(timeSec, row);
      lastRow = row;
    }
    trimHistoryMap(tfMap);
    if (lastRow) {
      mergeIndicators(tf, lastRow.indicators);
    }

    if (state.activeTimeframe === null) {
      if (state.smcTimeframe === null) state.smcTimeframe = tf; // first data ever - SMC dropdown starts matching the chart
      switchTimeframe(tf); // first data ever received - adopt this timeframe as the default view
      return;
    }

    if (isNewTimeframe) {
      renderTabs();
    }

    if (tf === state.activeTimeframe) {
      switchTimeframe(tf); // bulk-redraw now that this timeframe's history has arrived
    }
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    state.knownTimeframes.forEach((tf) => {
      const btn = document.createElement('button');
      btn.textContent = tf;
      btn.className = tf === state.activeTimeframe ? 'tab active' : 'tab';
      btn.addEventListener('click', () => switchTimeframe(tf));
      tabsEl.appendChild(btn);
    });
    renderSmcTimeframeSelect();
  }

  // Populated from the same source as the candlestick tabs
  // (state.knownTimeframes), but its selected value tracks state.smcTimeframe
  // independently - rebuilding the <option>s never changes the selection.
  function renderSmcTimeframeSelect() {
    smcTimeframeSelect.innerHTML = '';
    state.knownTimeframes.forEach((tf) => {
      const opt = document.createElement('option');
      opt.value = tf;
      opt.textContent = tf;
      smcTimeframeSelect.appendChild(opt);
    });
    if (state.smcTimeframe !== null) smcTimeframeSelect.value = state.smcTimeframe;
  }

  function switchTimeframe(tf) {
    state.activeTimeframe = tf;
    renderTabs();

    const rows = Array.from(state.dataByTimeframe.get(tf).entries())
      .sort((a, b) => a[0] - b[0])
      .map((entry) => entry[1]);

    candleSeries.setData(rows.map((r) => ({
      time: Math.floor(r.open_time / 1000), open: r.open, high: r.high, low: r.low, close: r.close,
    })));
    volumeSeries.setData(rows.map((r) => ({
      time: Math.floor(r.open_time / 1000), value: r.base_volume,
      color: r.close >= r.open ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)',
    })));
    setLineData(smaSeries, rows, (r) => r.indicators.sma);
    setLineData(emaSeries, rows, (r) => r.indicators.ema);
    setLineData(bbUpperSeries, rows, (r) => r.indicators.bb_upper);
    setLineData(bbLowerSeries, rows, (r) => r.indicators.bb_lower);

    chart.timeScale().fitContent();
    recomputeVolumeProfile();
    renderSmcOverlays();

    const last = rows[rows.length - 1];
    if (last) {
      updateReadout(last);
      applyPredictionLines(last);
    } else {
      readoutTable.innerHTML = '';
      predictionBox.innerHTML = '';
      readoutSymbol.textContent = '—';
    }
  }

  // =====================================================================
  // SMC/ICT: ingestion + rendering. Mirrors the candle/indicator pattern
  // above (a snapshot bulk-replaces state, a live update merges into it),
  // but SMC data is NOT part of state.dataByTimeframe / the 50,000-candle
  // history map - see visualization.h's class comment on why the backend
  // keeps this as its own store, and smcState above.
  // =====================================================================

  const kMaxSmcListLength = 500;  // client-side cap mirroring the backend's own bounded active-lists

  function emptySmcEntry() {
    return {
      swingHighs: [], swingLows: [], fvgs: [], balancedRanges: [], orderBlocks: [],
      equalLevels: [], structuralEvents: [], pdh: null, pdl: null, premiumDiscount: null,
      bias: 'undetermined',
    };
  }

  function getOrCreateSmcEntry(tf) {
    if (!smcState.byTimeframe.has(tf)) smcState.byTimeframe.set(tf, emptySmcEntry());
    return smcState.byTimeframe.get(tf);
  }

  function capList(list) {
    while (list.length > kMaxSmcListLength) list.shift();
    return list;
  }

  // Replaces one of an entry's arrays by matching on a stable id field
  // (e.g. "anchor_at" for Order Blocks, "confirmed_at" for FVGs) if
  // present, otherwise appends. Used for both `_formed` (append-only) and
  // `_changed` (update-in-place) deltas - formed items simply never match
  // an existing id, so they fall through to append either way.
  function mergeById(list, items, idField) {
    for (const item of items) {
      const idx = list.findIndex((existing) => existing[idField] === item[idField]);
      if (idx >= 0) list[idx] = item; else list.push(item);
    }
    capList(list);
  }

  function ingestSmcSnapshot(msg) {
    const entry = {
      swingHighs: msg.swing_highs || [], swingLows: msg.swing_lows || [],
      fvgs: msg.fvgs || [], balancedRanges: msg.balanced_ranges || [],
      orderBlocks: msg.order_blocks || [], equalLevels: msg.equal_levels || [],
      structuralEvents: smcState.byTimeframe.has(msg.timeframe)
        ? smcState.byTimeframe.get(msg.timeframe).structuralEvents : [],
      pdh: msg.pdh, pdl: msg.pdl, premiumDiscount: msg.premium_discount, bias: msg.bias,
    };
    smcState.byTimeframe.set(msg.timeframe, entry);
    updateBiasBadge(msg.timeframe);
    if (msg.timeframe === state.smcTimeframe) renderSmcOverlays();
  }

  function ingestSmcUpdate(msg) {
    const entry = getOrCreateSmcEntry(msg.timeframe);
    if (msg.swings) {
      for (const sp of msg.swings) {
        capList((sp.is_high ? entry.swingHighs : entry.swingLows)).push(sp);
      }
    }
    if (msg.fvgs_formed) mergeById(entry.fvgs, msg.fvgs_formed, 'confirmed_at');
    if (msg.fvgs_changed) mergeById(entry.fvgs, msg.fvgs_changed, 'confirmed_at');
    if (msg.balanced_ranges_formed) { entry.balancedRanges.push(...msg.balanced_ranges_formed); capList(entry.balancedRanges); }
    if (msg.obs_formed) mergeById(entry.orderBlocks, msg.obs_formed, 'anchor_at');
    if (msg.obs_changed) mergeById(entry.orderBlocks, msg.obs_changed, 'anchor_at');
    if (msg.structural_events) { entry.structuralEvents.push(...msg.structural_events); capList(entry.structuralEvents); }
    if (msg.equal_levels) { entry.equalLevels.push(...msg.equal_levels); capList(entry.equalLevels); }
    if (msg.previous_day_levels) { entry.pdh = msg.previous_day_levels.pdh; entry.pdl = msg.previous_day_levels.pdl; }
    if (msg.premium_discount !== undefined) entry.premiumDiscount = msg.premium_discount;
    if (msg.bias) entry.bias = msg.bias;

    updateBiasBadge(msg.timeframe);
    if (msg.timeframe === state.smcTimeframe) renderSmcOverlays();
  }

  function updateBiasBadge(tf) {
    if (tf !== state.smcTimeframe) return;
    const entry = smcState.byTimeframe.get(tf);
    const bias = entry ? entry.bias : 'undetermined';
    biasBadge.textContent = `bias: ${bias}`;
    biasBadge.className = bias === 'bullish' ? 'bullish' : bias === 'bearish' ? 'bearish' : '';
  }

  // ---- master redraw: markers (swings+structure), price lines
  // (liquidity/PDH-PDL/premium-discount), zones (FVG/OB/OTE band), and
  // kill-zone time shading. Called on timeframe switch, on every SMC
  // snapshot/update for the active timeframe, and on pan/zoom (for the
  // time-bounded overlays). ----
  function renderSmcOverlays() {
    const entry = smcState.byTimeframe.get(state.smcTimeframe);
    renderSmcMarkers(entry);
    renderLiquidityAndLevels(entry);
    renderSmcZones(entry);
    renderKillZoneBands();
  }

  function lastVisibleTimeSec() {
    const range = chart.timeScale().getVisibleRange();
    if (range && range.to !== null && range.to !== undefined) return range.to;
    const tfMap = state.dataByTimeframe.get(state.activeTimeframe);
    if (!tfMap || tfMap.size === 0) return Math.floor(Date.now() / 1000);
    let last = 0;
    for (const t of tfMap.keys()) if (t > last) last = t;
    return last;
  }

  function renderSmcMarkers(entry) {
    if (!entry) { candleSeries.setMarkers([]); return; }
    const markers = [];
    if (smcToggleState.swings) {
      for (const sp of entry.swingHighs) {
        markers.push({ time: Math.floor(sp.open_time / 1000), position: 'aboveBar', color: '#787b86',
                       shape: 'arrowUp', text: 'SH' });
      }
      for (const sp of entry.swingLows) {
        markers.push({ time: Math.floor(sp.open_time / 1000), position: 'belowBar', color: '#787b86',
                       shape: 'arrowDown', text: 'SL' });
      }
    }
    if (smcToggleState.structure) {
      for (const ev of entry.structuralEvents) {
        const t = Math.floor(ev.open_time / 1000);
        if (ev.kind === 'bullish_bos') markers.push({ time: t, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'BOS' });
        else if (ev.kind === 'bearish_bos') markers.push({ time: t, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: 'BOS' });
        else if (ev.kind === 'bullish_choch') markers.push({ time: t, position: 'belowBar', color: '#42a5f5', shape: 'arrowUp', text: ev.is_mss ? 'MSS' : 'CHoCH' });
        else if (ev.kind === 'bearish_choch') markers.push({ time: t, position: 'aboveBar', color: '#ffa726', shape: 'arrowDown', text: ev.is_mss ? 'MSS' : 'CHoCH' });
        else if (ev.kind === 'liquidity_sweep_high') markers.push({ time: t, position: 'aboveBar', color: '#b71c1c', shape: 'circle', text: 'SWEEP' });
        else if (ev.kind === 'liquidity_sweep_low') markers.push({ time: t, position: 'belowBar', color: '#b71c1c', shape: 'circle', text: 'SWEEP' });
      }
    }
    markers.sort((a, b) => a.time - b.time);
    candleSeries.setMarkers(markers);
  }

  // Horizontal createPriceLine()s: unswept BSL/SSL, Equal-High/Low levels,
  // PDH/PDL, and Premium/Discount's Equilibrium+OTE levels. All share one
  // tracked handle list (activeSmcPriceLines) cleared and rebuilt each call
  // - same pattern applyPredictionLines() already uses for its own lines.
  function renderLiquidityAndLevels(entry) {
    activeSmcPriceLines.forEach((line) => candleSeries.removePriceLine(line));
    activeSmcPriceLines = [];
    if (!entry) return;

    const addLine = (price, color, title, dashed) => {
      if (price === null || price === undefined) return;
      activeSmcPriceLines.push(candleSeries.createPriceLine({
        price, color, lineWidth: 1,
        lineStyle: dashed ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
        axisLabelVisible: true, title,
      }));
    };

    if (smcToggleState.liquidity) {
      for (const sp of entry.swingHighs) {
        if (!sp.swept) addLine(sp.price, '#ef5350', 'BSL', true);
      }
      for (const sp of entry.swingLows) {
        if (!sp.swept) addLine(sp.price, '#26a69a', 'SSL', true);
      }
      for (const eq of entry.equalLevels) {
        addLine((eq.price_a + eq.price_b) / 2, '#ba68c8', eq.is_high ? 'EQH' : 'EQL', true);
      }
    }
    if (smcToggleState.pdhpdl) {
      addLine(entry.pdh, '#787b86', 'PDH', false);
      addLine(entry.pdl, '#787b86', 'PDL', false);
    }
    if (smcToggleState.premiumDiscount && entry.premiumDiscount) {
      const pd = entry.premiumDiscount;
      addLine(pd.equilibrium, '#ffffff', 'EQ', true);
      addLine(pd.ote_705, '#ffd54f', 'OTE 70.5', true);
    }
  }

  // Price/time-bounded rectangles (FVG, Order Blocks, Premium/Discount's
  // OTE band) via the same absolutely-positioned-overlay-div technique as
  // the volume profile - Lightweight Charts v4 has no native rectangle
  // primitive, so this reads chart pixel coordinates via
  // priceToCoordinate()/timeScale().timeToCoordinate() exactly the way
  // recomputeVolumeProfile() already does below. An unresolved zone (not
  // yet mitigated/invalidated) is drawn out to the last visible candle, so
  // it visually reads as "still active."
  function renderSmcZones(entry) {
    smcZonesEl.innerHTML = '';
    if (!entry) return;
    const frag = document.createDocumentFragment();
    const rightEdgeSec = lastVisibleTimeSec();

    const addZone = (startSec, endSec, priceLow, priceHigh, className, label) => {
      let x1 = chart.timeScale().timeToCoordinate(startSec);
      const x2 = chart.timeScale().timeToCoordinate(endSec);
      const yTop = candleSeries.priceToCoordinate(priceHigh);
      const yBottom = candleSeries.priceToCoordinate(priceLow);
      if (yTop === null || yBottom === null) return;
      if (x1 === null) {
        // Zone starts before the chart's earliest loaded/visible candle -
        // the main case for higher-timeframe zones viewed on a lower
        // timeframe. Clamp to the left edge instead of hiding it, unless
        // it's off-screen for some other reason (e.g. starts after the
        // visible range, which shouldn't normally happen for a formed zone).
        const visibleRange = chart.timeScale().getVisibleRange();
        if (visibleRange && startSec < visibleRange.from) {
          x1 = 0;
        } else {
          return;
        }
      }
      const left = x1;
      const width = Math.max(1, (x2 === null ? chartContainer.clientWidth : x2) - x1);
      const div = document.createElement('div');
      div.className = 'smc-zone ' + className;
      div.style.left = `${left}px`;
      div.style.top = `${yTop}px`;
      div.style.width = `${width}px`;
      div.style.height = `${Math.max(1, yBottom - yTop)}px`;
      frag.appendChild(div);
      if (label) {
        const lbl = document.createElement('div');
        lbl.className = 'smc-zone-label';
        lbl.textContent = label;
        lbl.style.left = `${left + 2}px`;
        lbl.style.top = `${yTop + 1}px`;
        lbl.style.color = className.includes('bearish') ? '#ef5350' : '#26a69a';
        frag.appendChild(lbl);
      }
    };

    if (smcToggleState.fvg) {
      for (const f of entry.fvgs) {
        const endSec = f.filled && f.mitigated_at ? Math.floor(f.mitigated_at / 1000) : rightEdgeSec;
        addZone(Math.floor(f.formed_at / 1000), endSec, f.gap_low, f.gap_high,
                f.bullish ? 'smc-fvg-bullish' : 'smc-fvg-bearish', f.inverted ? 'IFVG' : 'FVG');
      }
    }
    if (smcToggleState.orderBlocks) {
      for (const ob of entry.orderBlocks) {
        const endSec = ob.invalidated && ob.invalidated_at ? Math.floor(ob.invalidated_at / 1000) : rightEdgeSec;
        let cls = ob.bullish ? 'smc-ob-bullish' : 'smc-ob-bearish';
        if (ob.subtype === 'rejection') cls += ' smc-ob-rejection';
        if (ob.subtype === 'breaker') cls += ' smc-ob-breaker';
        addZone(Math.floor(ob.anchor_at / 1000), endSec, ob.zone_low, ob.zone_high, cls,
                ob.subtype !== 'standard' ? ob.subtype.toUpperCase() : 'OB');
      }
    }
    if (smcToggleState.premiumDiscount && entry.premiumDiscount) {
      const pd = entry.premiumDiscount;
      addZone(Math.floor(pd.terminus_at / 1000), rightEdgeSec, pd.ote_786, pd.ote_618, 'smc-ote-band', 'OTE');
    }

    smcZonesEl.appendChild(frag);
  }

  // ---- Kill Zone time shading - computed entirely client-side. ----
  // Each zone is a fixed NY-local wall-clock window (see
  // ict_smc_numerical_definitions.md section 8); the browser's own
  // Intl.DateTimeFormat with timeZone: 'America/New_York' already handles
  // the DST-aware conversion natively, so there is no need to duplicate
  // the backend's hand-rolled ny_time.cpp logic here as well.
  const kKillZoneDefs = [
    { name: 'asian', label: 'Asian', accent: '#ba68c8', startMin: 20 * 60, endMin: 24 * 60 },
    { name: 'london', label: 'London', accent: '#fff176', startMin: 2 * 60, endMin: 5 * 60 },
    { name: 'new_york_am', label: 'NY AM', accent: '#26a69a', startMin: 7 * 60, endMin: 10 * 60 },
    { name: 'london_close', label: 'London Close', accent: '#42a5f5', startMin: 10 * 60, endMin: 12 * 60 },
  ];
  const nyTimeFormatter = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
  });

  function nyMinuteOfDayAndMidnightMs(epochMs) {
    const parts = nyTimeFormatter.formatToParts(new Date(epochMs));
    const get = (type) => parseInt(parts.find((p) => p.type === type).value, 10);
    // Modulo BEFORE computing midnightMs: some engines report "hour24" as 24
    // instead of 0 at exact local midnight, which would otherwise leave
    // minuteOfDay >= 1440 for the midnightMs subtraction below and silently
    // shift the day boundary by 24 hours even though the returned
    // minuteOfDay itself looked correct.
    const minuteOfDay = (get('hour') * 60 + get('minute')) % 1440;
    const midnightMs = epochMs - minuteOfDay * 60000;
    return { minuteOfDay, midnightMs };
  }

  function renderKillZoneBands() {
    killZoneEl.innerHTML = '';
    if (!smcToggleState.killZones || state.activeTimeframe === null) return;
    let range = chart.timeScale().getVisibleRange();
    if (!range) {
      // Fallback for when getVisibleRange() hasn't settled yet - derive an
      // equivalent time range from the logical range + this timeframe's own
      // candle map, mirroring recomputeVolumeProfile()'s own translation.
      const logicalRange = chart.timeScale().getVisibleLogicalRange();
      const tfMap = state.dataByTimeframe.get(state.activeTimeframe);
      if (!logicalRange || !tfMap || tfMap.size === 0) return;
      const sortedTimes = Array.from(tfMap.keys()).sort((a, b) => a - b);
      const from = sortedTimes[Math.max(0, Math.floor(logicalRange.from))];
      const to = sortedTimes[Math.min(sortedTimes.length - 1, Math.ceil(logicalRange.to))];
      if (from === undefined || to === undefined) return;
      range = { from, to };
    }

    const frag = document.createDocumentFragment();
    const startMs = range.from * 1000 - 24 * 3600 * 1000;  // pad a day either side so bands at the edges aren't clipped
    const endMs = range.to * 1000 + 24 * 3600 * 1000;
    const dayMs = 24 * 3600 * 1000;

    for (let ms = startMs; ms <= endMs; ms += dayMs) {
      const { midnightMs } = nyMinuteOfDayAndMidnightMs(ms);
      for (const zone of kKillZoneDefs) {
        const zoneStartMs = midnightMs + zone.startMin * 60000;
        const zoneEndMs = midnightMs + zone.endMin * 60000;
        const x1 = chart.timeScale().timeToCoordinate(Math.floor(zoneStartMs / 1000));
        const x2 = chart.timeScale().timeToCoordinate(Math.floor(zoneEndMs / 1000));
        if (x1 === null && x2 === null) continue;
        const left = x1 === null ? 0 : x1;
        const right = x2 === null ? chartContainer.clientWidth : x2;
        if (right <= left) continue;
        const div = document.createElement('div');
        div.className = 'kill-zone-band kz-' + zone.name;
        div.style.left = `${left}px`;
        div.style.width = `${right - left}px`;
        frag.appendChild(div);

        const lbl = document.createElement('div');
        lbl.className = 'smc-zone-label kill-zone-label';
        lbl.textContent = zone.label;
        lbl.style.left = `${left + 2}px`;
        lbl.style.color = zone.accent;
        frag.appendChild(lbl);
      }
    }
    killZoneEl.appendChild(frag);
  }

  function setLineData(series, rows, pick) {
    const points = [];
    for (const r of rows) {
      const v = pick(r);
      if (v !== null && v !== undefined) {
        points.push({ time: Math.floor(r.open_time / 1000), value: v });
      }
    }
    series.setData(points);
  }

  function applyLiveUpdate(msg, timeSec) {
    candleSeries.update({ time: timeSec, open: msg.open, high: msg.high, low: msg.low, close: msg.close });
    volumeSeries.update({
      time: timeSec, value: msg.base_volume,
      color: msg.close >= msg.open ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)',
    });
    // Indicators are only ever non-null on the candle's FINAL closed
    // update (see the comment in binance.cpp's renderLine) - so this
    // naturally leaves indicator LINES untouched while a candle is still
    // forming, and only extends them once the real value lands at close.
    // (The numeric readout panel below uses the separately-merged
    // "last known" values instead - see mergeIndicators/updateReadout.)
    const ind = msg.indicators;
    if (ind.sma !== null) smaSeries.update({ time: timeSec, value: ind.sma });
    if (ind.ema !== null) emaSeries.update({ time: timeSec, value: ind.ema });
    if (ind.bb_upper !== null) bbUpperSeries.update({ time: timeSec, value: ind.bb_upper });
    if (ind.bb_lower !== null) bbLowerSeries.update({ time: timeSec, value: ind.bb_lower });

    updateReadout(msg);
    applyPredictionLines(msg);
    recomputeVolumeProfile(); // the forming candle's own H/L can shift the visible price range
  }

  // ---- readout panel (oscillators that don't share the price chart's scale) ----
  function fmt(v, digits) {
    if (v === null || v === undefined) return '—';
    return Number(v).toFixed(digits === undefined ? 4 : digits);
  }

  function updateReadout(msg) {
    const liveBadge = msg.closed === false ? '<span class="liveBadge">● LIVE</span>' : '';
    readoutSymbol.innerHTML = `${msg.symbol} · ${msg.timeframe}${liveBadge}`;
    // Use the merged "last known" indicators, not msg.indicators directly -
    // msg.indicators is blank on every forming-candle tick, and using it
    // raw here would blank the panel almost all the time. See
    // mergeIndicators() above.
    const ind = lastIndicatorsByTf.get(msg.timeframe) || msg.indicators;
    const rows = [
      ['Close', fmt(msg.close, 4)],
      ['Base Vol', fmt(msg.base_volume, 2)],
      ['RSI(14)', fmt(ind.rsi, 2)],
      ['MACD', `${fmt(ind.macd_line, 4)} / ${fmt(ind.macd_signal, 4)} / ${fmt(ind.macd_histogram, 4)}`],
      ['Stoch %K/%D', `${fmt(ind.stoch_k, 2)} / ${fmt(ind.stoch_d, 2)}`],
      ['ATR(14)', fmt(ind.atr, 4)],
      ['VWAP', fmt(ind.vwap, 4)],
      ['OBV', fmt(ind.obv, 0)],
    ];
    readoutTable.innerHTML = rows.map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`).join('');
  }

  // ---- prediction overlay (entry/TP/SL price lines + zone bounds) ----
  // Zones render as a pair of price lines marking their high/low bounds
  // rather than a shaded rectangle: Lightweight Charts v4's price-line API
  // covers this with zero extra dependencies, whereas true shaded regions
  // need a custom canvas primitive that's out of scope until the
  // prediction engine itself exists and it's clear how zones actually look
  // in practice.
  function applyPredictionLines(msg) {
    activePriceLines.forEach((line) => candleSeries.removePriceLine(line));
    activePriceLines = [];
    predictionBox.innerHTML = '';

    const p = msg.prediction;
    if (!p) return;

    const addLine = (price, color, title) => {
      if (price === null || price === undefined) return;
      activePriceLines.push(candleSeries.createPriceLine({
        price, color, lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true, title,
      }));
    };

    addLine(p.entry_long, '#26a69a', 'Entry L');
    addLine(p.entry_short, '#ef5350', 'Entry S');
    addLine(p.take_profit_long, '#26a69a', 'TP L');
    addLine(p.take_profit_short, '#ef5350', 'TP S');
    addLine(p.stop_loss_long, '#b71c1c', 'SL L');
    addLine(p.stop_loss_short, '#b71c1c', 'SL S');
    (p.zones || []).forEach((zone) => {
      addLine(zone.price_high, '#ffa726', `${zone.label} hi`);
      addLine(zone.price_low, '#ffa726', `${zone.label} lo`);
    });

    predictionBox.innerHTML = '<em>Prediction active — see dashed price lines on the chart.</em>';
  }

  // ---- volume profile (visible-range volume-by-price, left-side bars) ----
  // Approximated from OHLCV since we have no tick/aggTrade data: each
  // candle's base_volume is distributed across the price buckets its
  // [low, high] range overlaps, weighted by overlap fraction. Each
  // bucket's bar is then split into a buy segment (using
  // taker_buy_base_volume, which we already capture) and a sell segment
  // (the remainder), so it reads like a buy/sell footprint even though
  // it's fundamentally a price-based volume profile, not per-candle order
  // flow. Scoped to the chart's current visible logical range, so it
  // updates as you pan/zoom.
  function recomputeVolumeProfile() {
    volumeProfileEl.innerHTML = '';
    if (!toggleState.volumeProfile) return;
    if (state.activeTimeframe === null) return;

    const allRows = Array.from(state.dataByTimeframe.get(state.activeTimeframe).values())
      .sort((a, b) => a.open_time - b.open_time);
    if (allRows.length === 0) return;

    let rows = allRows;
    const visibleRange = chart.timeScale().getVisibleLogicalRange();
    if (visibleRange) {
      const from = Math.max(0, Math.floor(visibleRange.from));
      const to = Math.min(allRows.length - 1, Math.ceil(visibleRange.to));
      if (from <= to) rows = allRows.slice(from, to + 1);
    }
    if (rows.length === 0) return;

    let minPrice = Infinity, maxPrice = -Infinity;
    for (const r of rows) {
      if (r.low < minPrice) minPrice = r.low;
      if (r.high > maxPrice) maxPrice = r.high;
    }
    if (!isFinite(minPrice) || !isFinite(maxPrice) || maxPrice <= minPrice) return;

    const bucketSize = (maxPrice - minPrice) / kVolumeProfileBuckets;
    const buyVol = new Array(kVolumeProfileBuckets).fill(0);
    const sellVol = new Array(kVolumeProfileBuckets).fill(0);

    for (const r of rows) {
      const candleRange = (r.high - r.low) || bucketSize;
      const buyShare = r.base_volume > 0 ? (r.taker_buy_base_volume / r.base_volume) : 0.5;
      const firstBucket = Math.max(0, Math.floor((r.low - minPrice) / bucketSize));
      const lastBucket = Math.min(kVolumeProfileBuckets - 1, Math.floor((r.high - minPrice) / bucketSize));
      for (let b = firstBucket; b <= lastBucket; b++) {
        const bucketLo = minPrice + b * bucketSize;
        const bucketHi = bucketLo + bucketSize;
        const overlapLo = Math.max(bucketLo, r.low);
        const overlapHi = Math.min(bucketHi, r.high);
        const overlap = Math.max(0, overlapHi - overlapLo);
        const share = overlap / candleRange;
        buyVol[b] += r.base_volume * share * buyShare;
        sellVol[b] += r.base_volume * share * (1 - buyShare);
      }
    }

    let maxTotal = 0;
    for (let b = 0; b < kVolumeProfileBuckets; b++) {
      maxTotal = Math.max(maxTotal, buyVol[b] + sellVol[b]);
    }
    if (maxTotal <= 0) return;

    const frag = document.createDocumentFragment();
    for (let b = 0; b < kVolumeProfileBuckets; b++) {
      const total = buyVol[b] + sellVol[b];
      if (total <= 0) continue;
      const bucketLo = minPrice + b * bucketSize;
      const bucketHi = bucketLo + bucketSize;
      const yTop = candleSeries.priceToCoordinate(bucketHi);
      const yBottom = candleSeries.priceToCoordinate(bucketLo);
      if (yTop === null || yBottom === null) continue;
      const barHeight = Math.max(1, yBottom - yTop);
      const buyWidth = (buyVol[b] / maxTotal) * kVolumeProfileMaxWidthPx;
      const sellWidth = (sellVol[b] / maxTotal) * kVolumeProfileMaxWidthPx;

      const buyBar = document.createElement('div');
      buyBar.className = 'vp-bar vp-buy';
      buyBar.style.top = `${yTop}px`;
      buyBar.style.height = `${barHeight}px`;
      buyBar.style.width = `${buyWidth}px`;
      frag.appendChild(buyBar);

      const sellBar = document.createElement('div');
      sellBar.className = 'vp-bar vp-sell';
      sellBar.style.top = `${yTop}px`;
      sellBar.style.left = `${buyWidth}px`;
      sellBar.style.height = `${barHeight}px`;
      sellBar.style.width = `${sellWidth}px`;
      frag.appendChild(sellBar);
    }
    volumeProfileEl.appendChild(frag);
  }

  connect();
})();
</script>
